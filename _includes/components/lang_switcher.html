{%- comment -%}
  Language switcher for polyglot
  Include as: {% include components/lang_switcher.html %}
{%- endcomment -%}

<div class="lang-switcher" style="display: flex; align-items: center; gap: 0.5rem;" data-default-lang="{{ site.default_lang }}" data-languages="{{ site.languages | join: ',' }}" data-base-url="{{ site.baseurl | default: '/' }}">
  <span class="lang-current" style="font-size: 0.875rem; color: var(--text-light, #888); font-weight: 500;"></span>
  <div class="dropdown" style="position: relative; z-index: 1000;">
    <button type="button" class="site-button btn-reset dropdown-toggle" aria-label="Select language" aria-expanded="false" aria-haspopup="true" style="padding: 0.375rem 0.75rem; font-size: 0.8125rem; font-weight: 500; background: transparent; border: 1px solid var(--border-color, #44434d); border-radius: 4px; color: var(--body-text-color, #e6e1e8); cursor: pointer; display: flex; align-items: center; gap: 0.375rem; min-width: 80px; justify-content: space-between;">
      <span class="lang-current-text">EN</span>
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true" style="width: 14px; height: 14px; flex-shrink: 0;"><path d="M7 10l5 5 5-5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="dropdown-menu" style="position: absolute; top: calc(100% + 4px); right: 0; min-width: 140px; background: var(--sidebar-color, #27262b); border: 1px solid var(--border-color, #44434d); border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); z-index: 1000; display: none; overflow: hidden;">
      {%- for lang in site.languages -%}
        <a href="#" class="dropdown-item" data-lang="{{ lang }}" style="display: block; padding: 0.625rem 1rem; color: var(--body-text-color, #e6e1e8); text-decoration: none; font-size: 0.875rem; font-weight: 500; transition: background 0.15s; border-bottom: 1px solid var(--border-color, #44434d);">{{ lang | upcase }}</a>
      {%- endfor -%}
    </div>
  </div>
</div>

<style>
.lang-switcher .dropdown-item:last-child { border-bottom: none; }
.lang-switcher .dropdown-item:hover { background: rgba(255,255,255,0.08); }
.lang-switcher .dropdown-item[aria-current="true"] { font-weight: 600; background: rgba(255,255,255,0.12); }
.lang-switcher .dropdown-toggle:hover { background: rgba(255,255,255,0.05); }
.lang-switcher .dropdown-menu.show { display: block !important; }
html[data-theme='light'] .lang-switcher .dropdown-toggle { border-color: var(--border-color, #e0e0e0); color: var(--body-text-color, #333); }
html[data-theme='light'] .lang-switcher .dropdown-menu { background: var(--sidebar-color, #fff); box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
html[data-theme='light'] .lang-switcher .dropdown-item { color: var(--body-text-color, #333); border-color: var(--border-color, #e0e0e0); }
html[data-theme='light'] .lang-switcher .dropdown-item:hover { background: rgba(0,0,0,0.05); }
html[data-theme='light'] .lang-switcher .dropdown-item[aria-current="true"] { background: rgba(0,0,0,0.08); }
html[data-theme='light'] .lang-switcher .dropdown-toggle:hover { background: rgba(0,0,0,0.03); }
</style>

<script src="{{ '/assets/js/lang-switcher.js' | relative_url }}"></script>
