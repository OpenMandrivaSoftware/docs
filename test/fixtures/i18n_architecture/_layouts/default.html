<!DOCTYPE html>
<html lang="{{ page.lang | default: site.active_lang }}">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>
  <meta name="page_id" content="{{ page.page_id }}">
  <meta name="active_lang" content="{{ site.active_lang }}">
  <meta name="page_lang" content="{{ page.lang }}">
  <meta name="source_lang" content="{{ page.source_lang }}">
  <meta name="rendered_lang" content="{{ page.rendered_lang }}">
  <meta name="parent_id" content="{{ page.parent_id }}">
  <meta name="resolved_parent" content="{{ page.parent }}">
</head>
<body>
  <h1>{{ page.title }}</h1>
  <div class="content">{{ content }}</div>
</body>
</html>
