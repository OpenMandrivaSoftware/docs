title: OpenMandriva Documentation
email: om@openmandriva.org
description: >- # this means to ignore newlines until "baseurl:"
  Documentation for the OpenMandriva Linux distribution.
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: OpenMandrivaOrg
github_username:  OpenMandrivaAssociation
git_repo_org:     OpenMandrivaSoftware
git_repo:         docs
git_repo_branch:  master
copyright: "OpenMandriva Association"

# Polyglot (multilingual) settings
languages: ['en', 'fr']
default_lang: 'en'
exclude_from_localization: ['assets', 'images', 'js', 'css', 'scss', 'sass', 'vendor', 'index.html']
parallel_localization: false

# Just-the-Docs Settings 
logo: "/assets/images/OM-200pl.png"
aux_links: 
  "OpenMandriva": 
    - "//openmandriva.org"
aux_links_new_tab: true
color_scheme: dark
callouts: 
  warning: 
    title: Warning
    color: red 
  important: 
    title: Important
    color: yellow
  note: 
    title: Note 
    color: green
  tip:
    title: Tip 
    color: blue
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      toc: true
toc:
  min_level: 2   # Default is 2 (## headings)
  max_level: 4   # Default is 3 (### headings)

# Build settings
theme: just-the-docs
plugins:
  - jekyll-feed
  - jekyll-polyglot

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
   - .agents/
   - AGENTS.md 
   - README.md 
   - LICENSE.md
   - doc/
   - drawings/
   - .sass-cache/
   - .jekyll-cache/
   - gemfiles/
   - Gemfile
   - Gemfile.lock
   - node_modules/
   - old-wiki/
   - test/
   - vendor/bundle/
   - vendor/cache/
   - vendor/gems/
   - vendor/ruby/
